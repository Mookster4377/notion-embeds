# Keeps the traffic map's police reports forever. The reports travel through ntfy.sh, which only holds
# messages for about 12 hours, so every 30 minutes this copies new ones into police-tampa.json and
# police-orlando.json on the "police-archive" branch (only ever added to; nothing is deleted).
name: Archive police reports

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: police-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Start from the archive
        run: |
          git clone -q --depth 1 --branch police-archive "https://github.com/${{ github.repository }}.git" archive || mkdir -p archive

      - name: Add new reports
        run: python3 scripts/archive_reports.py archive

      - name: Publish
        working-directory: archive
        run: |
          [ -d .git ] || { git init -q; git checkout -q -b police-archive; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No new reports."; exit 0; fi
          git commit -q -m "Police reports $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" police-archive
