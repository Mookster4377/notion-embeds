# Builds OpenStreetMap data for traffic.html every night and publishes it to the "map-data" branch
# (replaced each time, so the repo doesn't grow). The map reads it from raw.githubusercontent.com and
# falls back to the live OpenStreetMap servers for anything missing.
#
# Source: Geofabrik's daily Florida extract (one download), cut into Tampa Bay and Orlando tiles locally.
# If any step fails, nothing is published and yesterday's data stays in place.
name: Refresh map data

on:
  schedule:
    - cron: "23 7 * * *"   # 3:23 am Eastern (EDT) / 2:23 am (EST); Geofabrik updates Florida overnight
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install osmium
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install -q osmium

      - name: Download the Florida map (Geofabrik, with a mirror as backup)
        run: |
          # Geofabrik briefly 404s while it swaps in a new file, so retry for a while, then try the openstreetmap.fr mirror.
          for attempt in 1 2 3 4 5 6; do
            for url in https://download.geofabrik.de/north-america/us/florida-latest.osm.pbf \
                       https://download.openstreetmap.fr/extracts/north-america/us/florida-latest.osm.pbf; do
              if curl -fsSL --retry 3 --retry-delay 15 -o florida.osm.pbf "$url" && [ "$(stat -c %s florida.osm.pbf)" -gt 100000000 ]; then
                echo "Downloaded $url ($(du -h florida.osm.pbf | cut -f1))"; exit 0
              fi
              echo "::warning::Download failed from $url (attempt $attempt)"
            done
            sleep 300
          done
          echo "::error::Couldn't download the Florida map; keeping yesterday's data."; exit 1

      - name: Build Tampa Bay and Orlando tiles
        run: python scripts/build_map_data.py florida.osm.pbf out

      - name: Publish to the map-data branch
        working-directory: out
        run: |
          git init -q
          git checkout -q -b map-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Map data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" map-data
          du -sh . && ls tiles | wc -l && ls orlando/tiles | wc -l
