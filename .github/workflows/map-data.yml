# Builds OpenStreetMap data for traffic.html every night and publishes it to the "map-data" branch
# (replaced each time, so the repo doesn't grow). The map reads it from raw.githubusercontent.com and
# falls back to the live OpenStreetMap servers for anything missing.
#
# Source: Geofabrik's daily Florida extract (one download), cut into Tampa Bay and Orlando tiles locally.
# Each run starts from the published files, so whatever fails keeps yesterday's version.
name: Refresh map data

on:
  schedule:
    - cron: "23 7 * * *"   # 3:23 am Eastern (EDT) / 2:23 am (EST); Geofabrik updates Florida overnight
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install osmium
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install -q osmium pyshp shapely pyyaml

      - name: Start from the published data
        # Anything that fails below leaves yesterday's files in place instead of deleting them.
        run: |
          git clone -q --depth 1 --branch map-data "https://github.com/${{ github.repository }}.git" out || mkdir -p out
          rm -rf out/.git

      - name: Download the Florida map (Geofabrik, with a mirror as backup)
        id: osm
        continue-on-error: true
        run: |
          # Ask Geofabrik's own index where the Florida file lives (in case the path changes), then try the usual paths.
          INDEXED=$(curl -fsSL --retry 3 https://download.geofabrik.de/index-v1-nogeom.json | python3 -c "
          import json, sys
          for f in json.load(sys.stdin)['features']:
              p = f['properties']
              if p.get('id') in ('florida', 'us/florida'):
                  print(p['urls']['pbf']); break" || true)
          echo "Geofabrik index says: ${INDEXED:-<nothing>}"
          for attempt in 1 2 3; do
            for url in $INDEXED https://download.geofabrik.de/north-america/us/florida-latest.osm.pbf \
                       https://download.openstreetmap.fr/extracts/north-america/us/florida-latest.osm.pbf; do
              code=$(curl -sSL --retry 3 --retry-delay 15 -o florida.osm.pbf -w '%{http_code}' "$url" || true)
              size=$(stat -c %s florida.osm.pbf 2>/dev/null || echo 0)
              if [ "$code" = "200" ] && [ "$size" -gt 100000000 ]; then echo "Downloaded $url ($(du -h florida.osm.pbf | cut -f1))"; exit 0; fi
              echo "::warning::$url returned HTTP $code ($size bytes), attempt $attempt"
            done
            sleep 300
          done
          echo "::error::Couldn't download the Florida map; keeping yesterday's map data."; exit 1

      - name: Build Tampa Bay and Orlando tiles
        if: steps.osm.outcome == 'success'
        run: |
          python scripts/build_map_data.py florida.osm.pbf fresh
          cp -r fresh/. out/

      - name: Build representatives (districts and current members)
        if: ${{ !cancelled() }}
        run: python scripts/build_reps.py out   # keeps yesterday's file if a source is down

      - name: Publish to the map-data branch
        if: ${{ !cancelled() }}
        working-directory: out
        run: |
          [ -f meta.json ] && [ -d tiles ] || { echo "::error::No map data to publish (refusing to wipe the branch)."; exit 1; }
          git init -q
          git checkout -q -b map-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Map data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" map-data
          du -sh . && ls tiles | wc -l && ls orlando/tiles | wc -l
