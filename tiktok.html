<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autoplay TikTok</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #msg { font: 14px/1.4 system-ui, sans-serif; color: #888; padding: 16px; }
  </style>
</head>
<body>
  <!-- Usage: tiktok.html?v=VIDEO_ID  (the long number in a tiktok.com/@user/video/NUMBER link) -->
  <div id="msg"></div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var m = (p.get('v') || '').match(/(\d{15,25})/);
      if (!m) {
        document.getElementById('msg').textContent =
          'Add ?v=VIDEO_ID to the URL, e.g. tiktok.html?v=7556340985001676062';
        return;
      }
      var params = new URLSearchParams({
        autoplay: '1',
        loop: '1',
        muted: '1',
        controls: p.get('controls') === '1' ? '1' : '0',
        music_info: '0',
        description: '0',
        rel: '0'
      });
      var f = document.createElement('iframe');
      f.src = 'https://www.tiktok.com/player/v1/' + m[1] + '?' + params.toString();
      f.allow = 'autoplay; encrypted-media; fullscreen';
      f.title = 'TikTok video';
      document.body.innerHTML = '';
      document.body.appendChild(f);
    })();
  </script>
</body>
</html>
